<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="830" viewBox="0 0 1500 830" role="img" aria-label="Canlı ve replay kaynaklarından aynı 2D ve 3D arayüz">
    <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3865a7"/></marker><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b76828"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#53786d"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#25334a}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#5c6980}.node{font-size:22px;font-weight:650}.detail{font-size:17px;fill:#52627a}.tag{font-size:15px;fill:#52627a}.label{font-size:17px;font-weight:600}.small{font-size:16px}</style></defs><rect width="100%" height="100%" rx="20" fill="#fafbfe"/><text x="45" y="55" class="title" text-anchor="start">Tek görüntüleme modeli · canlı ve kayıt</text><text x="45" y="89" class="sub" text-anchor="start">Uçuş kodu yalnızca veri üretir; arayüzün açık olması gerekmez.</text><rect x="45" y="155" width="450" height="140" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="63" y="187" class="node" text-anchor="start">Ortak gözlem verileri</text><text x="63" y="215" class="detail" text-anchor="start">Durum · hesap · plan</text><text x="63" y="239" class="detail" text-anchor="start">Komut / füze olayları</text><rect x="565" y="155" width="430" height="140" rx="13" fill="#eaf4ef" stroke="#9cbcaf" stroke-width="1.5"/><text x="583" y="187" class="node" text-anchor="start">Canlı çıkış / LiveSource</text><text x="583" y="215" class="detail" text-anchor="start">Generic canlı yayın</text><text x="583" y="239" class="detail" text-anchor="start">Tarayıcıya C++ geçidi</text><rect x="1065" y="155" width="390" height="140" rx="13" fill="#eaf4ef" stroke="#9cbcaf" stroke-width="1.5"/><text x="1083" y="187" class="node" text-anchor="start">2D / 3D sahne</text><text x="1083" y="215" class="detail" text-anchor="start">İz · rota · açı / mesafe</text><text x="1083" y="239" class="detail" text-anchor="start">Zarf: model sağlıyorsa</text><polyline points="495,222 565,222" fill="none" stroke="#53786d" stroke-width="2.5" marker-end="url(#g)"/><polyline points="995,222 1065,222" fill="none" stroke="#53786d" stroke-width="2.5" marker-end="url(#g)"/><rect x="45" y="420" width="450" height="175" rx="13" fill="#eaf4ef" stroke="#9cbcaf" stroke-width="1.5"/><text x="63" y="452" class="node" text-anchor="start">Artımlı oturum kaydı</text><text x="63" y="480" class="detail" text-anchor="start">flight.acmi + state.bin</text><text x="63" y="504" class="detail" text-anchor="start">metrics.csv + plans.jsonl</text><text x="63" y="528" class="detail" text-anchor="start">events.jsonl + manifest.json</text><polyline points="270,295 270,420" fill="none" stroke="#53786d" stroke-width="2.5" marker-end="url(#g)"/><rect x="565" y="420" width="430" height="175" rx="13" fill="#eaf4ef" stroke="#9cbcaf" stroke-width="1.5"/><text x="583" y="452" class="node" text-anchor="start">ReplaySource</text><text x="583" y="480" class="detail" text-anchor="start">ACMI / ortak state okuyucusu</text><text x="583" y="504" class="detail" text-anchor="start">Ek hesap ve plan dosyaları</text><text x="583" y="528" class="detail" text-anchor="start">Eski BVRGym CSV desteği</text><polyline points="495,504 565,504" fill="none" stroke="#53786d" stroke-width="2.5" marker-end="url(#g)"/><polyline points="995,504 1260,504 1260,295" fill="none" stroke="#53786d" stroke-width="2.5" marker-end="url(#g)"/><text x="1145" y="484" class="label" text-anchor="middle">Aynı sahne modeli</text><rect x="45" y="665" width="660" height="115" rx="13" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.5"/><text x="63" y="697" class="node" text-anchor="start">Tacview dosya uyumluluğu</text><text x="63" y="725" class="detail" text-anchor="start">ACMI uçuşu açar; özel hesaplar ek dosyalardadır.</text><rect x="775" y="665" width="680" height="115" rx="13" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.5"/><text x="793" y="697" class="node" text-anchor="start">Tacview canlı çıkışı — sonraki aşama</text><text x="793" y="725" class="detail" text-anchor="start">Ayrı TCP + handshake + ACMI çıktı adaptörü gerekir.</text></svg>