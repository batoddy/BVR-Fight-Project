<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" role="img" aria-label="Simülasyon, hesaplama, komut ve gözlem mimarisi">
    <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3865a7"/></marker><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b76828"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#53786d"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#25334a}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#5c6980}.node{font-size:22px;font-weight:650}.detail{font-size:17px;fill:#52627a}.tag{font-size:15px;fill:#52627a}.label{font-size:17px;font-weight:600}.small{font-size:16px}</style></defs><rect width="100%" height="100%" rx="20" fill="#fafbfe"/><text x="45" y="55" class="title" text-anchor="start">Tek simülasyon sahibi · bağımsız düğümler</text><text x="45" y="86" class="sub" text-anchor="start">Durum yayınlanır; komut doğrulanır ve adım sınırında uygulanır.</text><rect x="45" y="140" width="340" height="126" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="63" y="172" class="node" text-anchor="start">Simülasyon Adaptörü</text><text x="63" y="200" class="detail" text-anchor="start">BVRGym / JSBSim nesneleri</text><text x="63" y="224" class="detail" text-anchor="start">Clock · State · Events</text><rect x="475" y="140" width="430" height="126" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="493" y="172" class="node" text-anchor="start">Gözlem + BVR Hesapları</text><text x="493" y="200" class="detail" text-anchor="start">Geometri · zarf · değerlendirme</text><text x="493" y="224" class="detail" text-anchor="start">Truth ve ajan gözlemi ayrı</text><rect x="1005" y="140" width="440" height="126" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="1023" y="172" class="node" text-anchor="start">Otonomi Arayüzü</text><text x="1023" y="200" class="detail" text-anchor="start">Gözlem + ölçümleri alır</text><text x="1023" y="224" class="detail" text-anchor="start">Karar / plan isteğini yayınlar</text><polyline points="385,205 475,205" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)"/><text x="428" y="185" class="label" text-anchor="middle">State</text><polyline points="905,205 1005,205" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)"/><text x="955" y="183" class="label" text-anchor="middle">Ölçümler</text><rect x="1005" y="345" width="440" height="126" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="1023" y="377" class="node" text-anchor="start">Planlayıcı + Takipçi</text><text x="1023" y="405" class="detail" text-anchor="start">Rota / zamanlı trajectory</text><text x="1023" y="429" class="detail" text-anchor="start">Plan → uçuş hedefi</text><polyline points="1225,266 1225,345" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)"/><text x="1243" y="310" class="label" text-anchor="start">Plan isteği</text><rect x="475" y="345" width="430" height="126" rx="13" fill="#fff1e4" stroke="#d4ad8a" stroke-width="1.5"/><text x="493" y="377" class="node" text-anchor="start">Komut Yöneticisi</text><text x="493" y="405" class="detail" text-anchor="start">Authority · süre / değer kontrolü</text><text x="493" y="429" class="detail" text-anchor="start">Kabul / red · tekil işlem ID</text><polyline points="1005,408 905,408" fill="none" stroke="#b76828" stroke-width="2.5" marker-end="url(#c)"/><text x="955" y="385" class="label" text-anchor="middle">Setpoint</text><polyline points="475,407 215,407 215,266" fill="none" stroke="#b76828" stroke-width="2.5" marker-end="url(#c)"/><text x="238" y="385" class="label" text-anchor="start">Uygulanacak komut</text><rect x="45" y="540" width="340" height="106" rx="13" fill="#fff1e4" stroke="#d4ad8a" stroke-width="1.5"/><text x="63" y="572" class="node" text-anchor="start">Manuel / Dış Program</text><text x="63" y="600" class="detail" text-anchor="start">Aynı FlightSetpoint sözleşmesi</text><polyline points="385,593 425,593 425,465 475,465" fill="none" stroke="#b76828" stroke-width="2.5" marker-end="url(#c)"/><text x="415" y="515" class="tag" text-anchor="middle">Komut</text><polyline points="690,266 690,345" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="710" y="310" class="tag" text-anchor="start">Doğrulama için durum</text><rect x="475" y="540" width="970" height="106" rx="13" fill="#edf1f8" stroke="#adbace"/><text x="500" y="572" class="node" text-anchor="start">Mesaj dağıtımı / gözlem hatları</text><text x="500" y="604" class="detail" text-anchor="start">State · Geometry · Envelope · Decision · Route · AppliedCommand · Events</text><text x="500" y="629" class="tag" text-anchor="start">Komut kanalı ve kayıpsız esas kayıt, PUB/SUB gözlem hattından ayrı.</text><polyline points="380,266 400,266 400,575 475,575" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><polyline points="890,266 935,266 935,540" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><polyline points="1420,266 1470,266 1470,591 1445,591" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><polyline points="1225,471 1225,540" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><rect x="475" y="736" width="430" height="126" rx="13" fill="#eaf4ef" stroke="#9cbcaf" stroke-width="1.5"/><text x="493" y="768" class="node" text-anchor="start">Arayüz Köprüsü</text><text x="493" y="796" class="detail" text-anchor="start">LiveSource / ReplaySource</text><text x="493" y="820" class="detail" text-anchor="start">HTTP + WebSocket</text><rect x="1005" y="736" width="440" height="126" rx="13" fill="#eaf4ef" stroke="#9cbcaf" stroke-width="1.5"/><text x="1023" y="768" class="node" text-anchor="start">Kaydedici / Replay</text><text x="1023" y="796" class="detail" text-anchor="start">Manifest · snapshot · komut · olay</text><text x="1023" y="820" class="detail" text-anchor="start">Kayıpsız esas kayıt ayrı yol</text><polyline points="690,646 690,736" fill="none" stroke="#53786d" stroke-width="2.5" marker-end="url(#g)"/><polyline points="1225,646 1225,736" fill="none" stroke="#53786d" stroke-width="2.5" marker-end="url(#g)"/><rect x="45" y="736" width="340" height="126" rx="13" fill="#eaf4ef" stroke="#9cbcaf" stroke-width="1.5"/><text x="63" y="768" class="node" text-anchor="start">2D / 3D Arayüz</text><text x="63" y="796" class="detail" text-anchor="start">Uçuş · plan · metrik katmanları</text><text x="63" y="820" class="detail" text-anchor="start">Kapatılması uçuşu etkilemez</text><polyline points="475,800 385,800" fill="none" stroke="#53786d" stroke-width="2.5" marker-end="url(#g)"/><text x="45" y="928" class="label" text-anchor="start" style="fill:#3865a7">Mavi: durum / plan / ölçüm</text><text x="435" y="928" class="label" text-anchor="start" style="fill:#b76828">Turuncu: komut / yetki</text><text x="850" y="928" class="label" text-anchor="start" style="fill:#53786d">Yeşil: görselleştirme / kayıt</text><text x="45" y="971" class="sub" text-anchor="start">Düğüm sınırı ≠ ayrı süreç zorunluluğu. Otonomi içeriği bu tasarımın dışında.</text></svg>