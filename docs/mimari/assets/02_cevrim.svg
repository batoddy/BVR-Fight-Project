    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#25334a}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#5c6980}.node{font-size:22px;font-weight:650}.detail{font-size:17px;fill:#52627a}.tag{font-size:15px;fill:#52627a}.label{font-size:17px;font-weight:600}.small{font-size:16px}</style></defs><rect width="100%" height="100%" rx="20" fill="#fafbfe"/><text x="45" y="55" class="title" text-anchor="start">Durum → hesap / komut → fizik → yeni durum</text><text x="45" y="89" class="sub" text-anchor="start">Komutlar adım sınırında alınır; simülasyon nesnelerini tek döngü yönetir.</text><rect x="45" y="165" width="252" height="138" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="63" y="197" class="node" text-anchor="start">1 · Durum S[k]</text><text x="63" y="225" class="detail" text-anchor="start">Zaman ve nesne kimlikleri</text><text x="63" y="249" class="detail" text-anchor="start">C++ giriş yöneticisi</text><polyline points="297,235 333,235" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)"/><rect x="333" y="165" width="252" height="138" rx="13" fill="#fff1e4" stroke="#d4ad8a" stroke-width="1.5"/><text x="351" y="197" class="node" text-anchor="start">2 · C++ işleme</text><text x="351" y="225" class="detail" text-anchor="start">Hesap / dış komut</text><text x="351" y="249" class="detail" text-anchor="start">Etkin kaynak seçimi</text><polyline points="585,235 621,235" fill="none" stroke="#b76828" stroke-width="2.5" marker-end="url(#c)"/><rect x="621" y="165" width="252" height="138" rx="13" fill="#fff1e4" stroke="#d4ad8a" stroke-width="1.5"/><text x="639" y="197" class="node" text-anchor="start">3 · Köprü</text><text x="639" y="225" class="detail" text-anchor="start">Komutu doğrula</text><text x="639" y="249" class="detail" text-anchor="start">Son hedefi sakla</text><polyline points="873,235 909,235" fill="none" stroke="#b76828" stroke-width="2.5" marker-end="url(#c)"/><rect x="909" y="165" width="252" height="138" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="927" y="197" class="node" text-anchor="start">4 · BVRGym</text><text x="927" y="225" class="detail" text-anchor="start">Uçak / aktif füze ilerlet</text><text x="927" y="249" class="detail" text-anchor="start">Yeni durumu topla</text><polyline points="1161,235 1197,235" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)"/><rect x="1197" y="165" width="252" height="138" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="1215" y="197" class="node" text-anchor="start">5 · Durum S[k+1]</text><text x="1215" y="225" class="detail" text-anchor="start">Durum + işlem sonuçları</text><text x="1215" y="249" class="detail" text-anchor="start">C++ / UI / kayıt</text><polyline points="1325,303 1325,355 170,355 170,303" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)"/><text x="750" y="343" class="label" text-anchor="middle">Sonraki çevrim</text><rect x="45" y="420" width="676" height="175" rx="13" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.5"/><text x="63" y="452" class="node" text-anchor="start">Sürekli uçuş hedefi</text><text x="63" y="480" class="detail" text-anchor="start">Heading · irtifa · gaz</text><text x="63" y="504" class="detail" text-anchor="start">Hedef değiştiğinde gönder; son geçerli hedef tutulur.</text><text x="63" y="528" class="detail" text-anchor="start">Heartbeat / süre yenilemesi bağlantıyı doğrular.</text><text x="63" y="552" class="detail" text-anchor="start">İlk simülasyon politikası: zaman aşımında duraklat.</text><rect x="779" y="420" width="676" height="175" rx="13" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.5"/><text x="797" y="452" class="node" text-anchor="start">Tek seferlik ateşleme emri</text><text x="797" y="480" class="detail" text-anchor="start">Emir ID · atan uçak ID · hedef ID</text><text x="797" y="504" class="detail" text-anchor="start">Tekrar gelen aynı emir yeniden uygulanmaz.</text><text x="797" y="528" class="detail" text-anchor="start">Kabul bilgisi ve gerçek fırlatma sonucu ayrı.</text><text x="797" y="552" class="detail" text-anchor="start">Atış kararı köprüde otomatik verilmez.</text><text x="45" y="656" class="label" text-anchor="start">Fizik adımı · dış kontrol çevrimi · ekran hızı ayrı ayarlardır.</text><text x="45" y="693" class="sub" text-anchor="start">Snapshot toplamak, sıralı fizik entegrasyonundaki hedef zaman farkını tek başına gidermez.</text></svg>