<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-label="Bir adımda durumdan komuta ve yeni duruma geçiş">
    <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3865a7"/></marker><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b76828"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#53786d"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#25334a}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#5c6980}.node{font-size:22px;font-weight:650}.detail{font-size:17px;fill:#52627a}.tag{font-size:15px;fill:#52627a}.label{font-size:17px;font-weight:600}.small{font-size:16px}</style></defs><rect width="100%" height="100%" rx="20" fill="#fafbfe"/><text x="45" y="55" class="title" text-anchor="start">S[k] → u[k] → S[k+1]</text><text x="45" y="88" class="sub" text-anchor="start">Komut aralık başında sabitlenir; yeni snapshot bütün ilgili nesneler ilerledikten sonra çıkar.</text><rect x="45" y="155" width="252" height="138" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="63" y="187" class="node" text-anchor="start">1 · Dünya durumu</text><text x="63" y="215" class="detail" text-anchor="start">S[k]</text><text x="63" y="239" class="detail" text-anchor="start">tick ve ortak zaman</text><polyline points="297,224 333,224" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)"/><rect x="333" y="155" width="252" height="138" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="351" y="187" class="node" text-anchor="start">2 · Hesap / istemci</text><text x="351" y="215" class="detail" text-anchor="start">Gözlem ve geometri</text><text x="351" y="239" class="detail" text-anchor="start">Manuel veya otonomi</text><polyline points="585,224 621,224" fill="none" stroke="#b76828" stroke-width="2.5" marker-end="url(#c)"/><rect x="621" y="155" width="252" height="138" rx="13" fill="#fff1e4" stroke="#d4ad8a" stroke-width="1.5"/><text x="639" y="187" class="node" text-anchor="start">3 · Komut seçimi</text><text x="639" y="215" class="detail" text-anchor="start">Yetki + doğrulama</text><text x="639" y="239" class="detail" text-anchor="start">u[k] sabitlenir</text><polyline points="873,224 909,224" fill="none" stroke="#b76828" stroke-width="2.5" marker-end="url(#c)"/><rect x="909" y="155" width="252" height="138" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="927" y="187" class="node" text-anchor="start">4 · Fizik aralığı</text><text x="927" y="215" class="detail" text-anchor="start">Uçak / füze alt adımları</text><text x="927" y="239" class="detail" text-anchor="start">k → k+1</text><polyline points="1161,224 1197,224" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)"/><rect x="1197" y="155" width="252" height="138" rx="13" fill="#eaf1fb" stroke="#9cb5d6" stroke-width="1.5"/><text x="1215" y="187" class="node" text-anchor="start">5 · Yeni durum</text><text x="1215" y="215" class="detail" text-anchor="start">S[k+1] + sonuç</text><text x="1215" y="239" class="detail" text-anchor="start">Kayıt + yayın</text><polyline points="1325,293 1325,347 170,347 170,293" fill="none" stroke="#3865a7" stroke-width="2.5" marker-end="url(#a)"/><text x="750" y="336" class="label" text-anchor="middle">Sonraki kontrol çevrimi</text><rect x="45" y="410" width="676" height="155" rx="13" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.5"/><text x="63" y="442" class="node" text-anchor="start">Yaklaşık gerçek zaman</text><text x="63" y="470" class="detail" text-anchor="start">Simülasyon kendi hızında ilerler.</text><text x="63" y="494" class="detail" text-anchor="start">Geçerli son komut uygulanır; gecikme görünür.</text><text x="63" y="518" class="detail" text-anchor="start">UI / hesaplayıcı gecikmesi fizik saatini yönetmez.</text><rect x="779" y="410" width="676" height="155" rx="13" fill="#ffffff" stroke="#c3ccdb" stroke-width="1.5"/><text x="797" y="442" class="node" text-anchor="start">Kilit adımlı deney</text><text x="797" y="470" class="detail" text-anchor="start">S[k] için gerekli cevabı bekle; sonra Step.</text><text x="797" y="494" class="detail" text-anchor="start">PUB/SUB yerine güvenilir adım alışverişi.</text><text x="797" y="518" class="detail" text-anchor="start">Timeout ve fallback sonucu kayda girer.</text><text x="45" y="630" class="label" text-anchor="start">Yaklaşık 120 Hz fizik  ≠  yaklaşık 12 Hz dış action  ≠  30–60 frame/s çizim</text><text x="45" y="667" class="sub" text-anchor="start">Füze uçuş yaşı ile ortak senaryo zamanı ayrı. Reset → yeni epoch.</text></svg>